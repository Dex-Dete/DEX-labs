<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>DEX Labs</title>
<link rel="icon" href="/favicon.ico" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1f2c4c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DEX Labs" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/airdrop.css" />
<link rel="stylesheet" href="/css/schedule.css" />
<link rel="stylesheet" href="/css/timers.css" />
<link rel="stylesheet" href="/css/settings.css" />
<link rel="stylesheet" href="/css/ytdownload.css" />
<link rel="stylesheet" href="/css/study.css" />
<link rel="stylesheet" href="/css/sbm.css" />
<link rel="stylesheet" href="/css/todos.css" />
<link rel="stylesheet" href="/css/cctv.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand-home">
      <span class="tab-mark"></span>DEX Labs<span class="subsystem-label" id="subsystem-label">Lesson Tracker</span>
    </div>
    <button class="study-chip" id="study-chip" hidden aria-label="Running study session - tap to open Study"></button>
    <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="subsystem-nav" id="subsystem-nav">
      <!-- v1.0.5: subsystem buttons here are no longer hardcoded - app.js
           builds them at runtime from GET /api/settings/subsystems (see
           loadAndRenderNav() in app.js, lib/subsystems-registry.js on the
           server). This is what lets a subsystem be hidden from the menu,
           and lets future subsystems (there will eventually be 30+) show
           up automatically without editing this file.
           v1.3.5: split into two groups - nav-icon-grid (subsystems +
           Settings) and nav-bottom-row (LAN + theme switch). On desktop
           both are `display:contents` so this looks exactly like one
           flat row, same as before. On mobile, nav-icon-grid becomes a
           compact square-icon grid instead of one-button-per-row, and
           nav-bottom-row renders as its own row underneath it - see the
           mobile breakpoint in style.css. The icon/name nav-label toggle
           that used to live here has moved to Settings > Navigation
           (still applies everywhere via the same body.nav-mode-* class -
           see applyNavMode() in app.js - just configured from one place
           instead of cluttering the nav itself). -->
      <div class="nav-icon-grid" id="nav-icon-grid">
        <div class="nav-links" id="nav-links"></div>
        <button class="nav-link" id="nav-settings-btn" title="Settings"><span class="nav-icon">⚙</span><span class="nav-name">Settings</span></button>
      </div>
      <div class="nav-bottom-row" id="nav-bottom-row">
        <button class="icon-btn nav-lan-btn" id="server-info-btn" title="Show LAN address">LAN address</button>
        <label class="nav-theme-toggle" id="nav-theme-toggle" title="Toggle dark/light mode">
          <span class="nav-theme-icon">☀️</span>
          <span class="toggle-switch">
            <input type="checkbox" id="theme-toggle-checkbox" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </span>
          <span class="nav-theme-icon">🌙</span>
        </label>
      </div>
    </nav>
  </header>
  <div class="nav-backdrop" id="nav-backdrop"></div>
  <div class="crumbs" id="crumbs"></div>
  <main id="view"></main>
  <div class="toast" id="toast"></div>
  <div class="build-footer" id="build-footer"></div>

  <script src="/js/airdrop.js"></script>
  <script src="/js/schedule.js"></script>
  <script src="/js/timers.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/ytdownload.js"></script>
  <script src="/js/study.js"></script>
  <script src="/js/sbm.js"></script>
  <script src="/js/todos.js"></script>
  <script src="/js/cctv.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // v1.6.2: installable app (PWA). Service workers only exist in a
    // secure context (localhost or HTTPS) - when DEX Labs is browsed
    // over plain HTTP on the LAN, nothing registers and the site works
    // exactly as before. On http://localhost (or an HTTPS address) the
    // browser gets the manifest + worker and offers to install DEX Labs
    // like any other app, with the DL icon.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
